name: Build

on:
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build versions
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5.5.0
        with:
          java-version: "25"
          distribution: microsoft

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          validate-wrappers: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build all versions
        run: ./gradlew build --build-cache --no-daemon

      - name: Upload 1.21.11 JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PackDisabler-1.21.11
          path: versions/1.21.11/build/libs/*.jar
          if-no-files-found: error
          archive: false

      - name: Upload 26.1.2 JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PackDisabler-26.1.2
          path: versions/26.1.2/build/libs/*.jar
          if-no-files-found: error
          archive: false

      - name: Upload 26.2 JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PackDisabler-26.2
          path: versions/26.2/build/libs/*.jar
          if-no-files-found: error
          archive: false
